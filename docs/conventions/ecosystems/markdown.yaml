# Markdown in this repository. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# markdownlint-cli2 with standards' .markdownlint-cli2.jsonc, as the ci-workflows markdownlint
# composite runs it (.github/workflows/pr-require-checks.yml:80-93). STANDARDS_DIR names a
# standards checkout, else the ghq root. Commands run from the
# repository root.
enabled: true
globs: ["*.md"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: 'markdownlint-cli2 --config "${STANDARDS_DIR:-$(git config --path --get ghq.root || printf ''%s'' "$HOME/ghq")/github.com/melodic-software/standards}/.markdownlint-cli2.jsonc" <files>'
fix-cmd: 'markdownlint-cli2 --config "${STANDARDS_DIR:-$(git config --path --get ghq.root || printf ''%s'' "$HOME/ghq")/github.com/melodic-software/standards}/.markdownlint-cli2.jsonc" --fix <files>'
code-fix-cmd: null
opt-in: "a melodic-software/standards checkout (STANDARDS_DIR, else under the ghq root) for .markdownlint-cli2.jsonc"
install-hint: "npm i -g markdownlint-cli2 at the version ci-workflows' markdownlint action pins"
gates: []
notes: "CI runs markdownlint-cli2 through the ci-workflows markdownlint action over '**/*.md'; this record calls the installed binary on the changed files, so a local run downloads nothing."
