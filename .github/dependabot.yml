version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      time: '05:20'
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      actions-scale-set-client:
        patterns:
          - github.com/actions/scaleset
      go-production:
        dependency-type: production
        patterns:
          - '*'
        exclude-patterns:
          - github.com/actions/scaleset

  - package-ecosystem: docker
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      time: '05:30'
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      worker-image:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      time: '05:40'
      timezone: America/New_York
    cooldown:
      default-days: 7
      # First-party releases take no soak (dependabot-policy `fastTrack.own`).
      exclude:
        - "melodic-software/ci-workflows/*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # The `vendor-actions` group (non-major only) is the auto-merge lane armed
    # by pr-automerge-dependabot.yml; a dependency joins the first group that
    # matches it, so majors fall through to the reviewed `github-actions` group.
    # `first-party-actions` keeps every ci-workflows action pin on one release.
    groups:
      first-party-actions:
        patterns:
          - melodic-software/*
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
