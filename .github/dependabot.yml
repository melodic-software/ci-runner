version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      time: '05:20'
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      actions-scale-set-client:
        patterns:
          - github.com/actions/scaleset
      go-production:
        dependency-type: production
        patterns:
          - '*'
        exclude-patterns:
          - github.com/actions/scaleset

  - package-ecosystem: docker
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      time: '05:30'
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      worker-image:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      time: '05:40'
      timezone: America/New_York
    cooldown:
      default-days: 7
      # First-party releases take no soak (the synced Dependabot policy's
      # `fastTrack.own`).
      exclude:
        - "melodic-software/ci-workflows/*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # The one first-party pin Dependabot leaves alone sits in the sync-managed
    # pr-check-managed-files-hosted.yml, which the standards sync owns.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/.github/actions/check-managed-files"
    # The `first-party-actions` group and the `vendor-actions` group (non-major
    # only) are the auto-merge lanes armed by pr-automerge-dependabot.yml. A
    # dependency joins the first group that matches it: a vendor major falls
    # through to the reviewed `github-actions` group, and a first-party major
    # stays in `first-party-actions`, where the lane does not arm a pull
    # request that holds a major bump, so it takes the review tier.
    groups:
      # Every ci-workflows composite-action pin moves in one pull request, so
      # the repository stays on one ci-workflows release.
      first-party-actions:
        patterns:
          - "melodic-software/*"
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
