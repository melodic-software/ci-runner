name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited`, `labeled` and `unlabeled` can change the pr-title /
    # do-not-merge / issue-linkage answers without a new commit, so the required
    # check has to re-evaluate. Whether such an event is CONTRACT-ONLY (lanes
    # gated off, ci-status carrying the recorded `ci-lanes` verdict forward) is
    # decided by one predicate, repeated verbatim in `cancel-in-progress` and in
    # every job's `if:` except `ci-status` and `go-fuzz`:
    #
    #   github.event.pull_request.head.repo.full_name == github.repository &&
    #   (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    #    (github.event.action == 'edited' && !github.event.changes.base))
    #
    # An `edited` event carrying `changes.base` is a BASE-BRANCH change: the
    # merge commit the lanes test changes with it, so that runs in full. A fork
    # pull request is never contract-only — its token is read-only on
    # `pull_request` whatever `permissions:` requests, so it cannot record lane
    # state — and runs the full workflow on every event exactly as before.
    # `go-fuzz` is left ungated because its own condition already restricts it
    # to `schedule` and `workflow_dispatch`, and the predicate is true only on
    # `pull_request`, so the gate would be a no-op there.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request (the existing key is kept). A contract-only event
# never cancels: it must queue behind an in-flight full run so the `ci-lanes`
# status it reads is already written. GitHub keeps one running and one pending
# run per group and the newest pending wins, so the carry-forward always
# executes after the full run it depends on. A `synchronize` still cancels
# everything on the old SHA. Push, schedule and dispatch runs fall back to
# `github.run_id`, so each is alone in its group and nothing cancels there
# either before or after this change.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}

jobs:
  markdown:
    name: Markdown
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: melodic-software/ci-workflows/.github/actions/markdown@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          config: .markdownlint-cli2.jsonc

  shellcheck:
    name: ShellCheck
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          rcfile: .shellcheckrc

  shfmt:
    name: Shell format
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell formatting
        uses: melodic-software/ci-workflows/.github/actions/shfmt@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0

  typos:
    name: Spelling
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: melodic-software/ci-workflows/.github/actions/typos@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          config: _typos.toml

  editorconfig:
    name: EditorConfig
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check EditorConfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          config: .editorconfig-checker.json

  gitleaks:
    name: Secret scan
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          config: .gitleaks.toml

  lychee:
    name: Offline links
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local links and anchors
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          config: lychee.toml

  comment-hygiene:
    name: Comment hygiene
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan comment hygiene
        uses: melodic-software/ci-workflows/.github/actions/comment-hygiene@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0

  actionlint:
    name: Actionlint
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0

  jsonschema:
    name: JSON schemas
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Dependabot configuration
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml

  exec-bit:
    name: Executable bits
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check executable bits
        uses: melodic-software/ci-workflows/.github/actions/exec-bit@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0

  machine-specific-paths:
    name: Machine-specific paths
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check machine-specific paths
        uses: melodic-software/ci-workflows/.github/actions/machine-specific-paths@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          # These files assert the official image's fixed in-container runner
          # home. They contain no host/user path; keep the exception exact.
          exclude: >-
            :(exclude)docs/worker-image.md
            :(exclude)scripts/Test-ReleasePins.ps1
            :(exclude)scripts/verify-worker-image.sh
            :(exclude)worker/capture-cgroup.sh
            :(exclude)worker/entrypoint.sh
            :(exclude)worker/set-state.sh

  eol-renormalize:
    name: EOL normalization
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/eol-renormalize@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0

  zizmor:
    name: Zizmor
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read # Reusable advisory audit reads the checked-in workflow graph.
      # Reusable zizmor.yml always declares security-events: write (expressions
      # are illegal in that scope). Callers must grant it too — reusable
      # workflows cannot elevate. Lane stays annotations-only
      # (upload-sarif defaults false); grant write so the job can start.
      security-events: write # Mandatory match for the reusable's own grant; see above.
    uses: melodic-software/ci-workflows/.github/workflows/zizmor.yml@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
    with:
      paths: .

  policy:
    name: Product policy
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Test workflow scripts
        run: node --test .github/scripts/*.test.cjs
      - name: Verify immutable dependency and publication contracts
        shell: pwsh
        run: ./scripts/Test-ReleasePins.ps1

  go-quality:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    uses: melodic-software/ci-workflows/.github/workflows/go-quality.yml@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
    with:
      config: .golangci.yml

  go-windows-build:
    name: Go Windows builds
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile Windows executables
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -o /tmp/ci-runner.exe ./cmd/ci-runner
          go build -trimpath -ldflags='-H=windowsgui' -o /tmp/ci-runner-controller.exe ./cmd/ci-runner-controller

  go-fuzz:
    name: Go fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz control request decoding
        id: fuzz_control
        continue-on-error: true
        run: >-
          go test ./internal/control -run='^$'
          -fuzz='^FuzzReadRequest$' -fuzztime=30s
      - name: Fuzz Docker archive validation
        id: fuzz_docker_archive
        continue-on-error: true
        run: >-
          go test ./internal/runtime/docker -run='^$'
          -fuzz='^FuzzReadSingleRegularArchive$' -fuzztime=30s
      - name: Collect newly generated failing inputs
        if: >-
          steps.fuzz_control.outcome == 'failure' ||
          steps.fuzz_docker_archive.outcome == 'failure'
        env:
          FUZZ_FAILURES: ${{ runner.temp }}/go-fuzz-failures
        run: |
          mkdir -p "$FUZZ_FAILURES"
          git ls-files --others --exclude-standard -- \
            internal/control/testdata/fuzz/FuzzReadRequest \
            internal/runtime/docker/testdata/fuzz/FuzzReadSingleRegularArchive \
            | while IFS= read -r file; do
              cp --parents "$file" "$FUZZ_FAILURES"
            done
      - name: Upload minimized failing inputs
        if: >-
          steps.fuzz_control.outcome == 'failure' ||
          steps.fuzz_docker_archive.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-fuzz-failures-${{ github.run_id }}
          path: ${{ runner.temp }}/go-fuzz-failures
          if-no-files-found: ignore
      - name: Report fuzz failures
        if: >-
          always() &&
          (steps.fuzz_control.outcome == 'failure' ||
          steps.fuzz_docker_archive.outcome == 'failure')
        env:
          CONTROL_OUTCOME: ${{ steps.fuzz_control.outcome }}
          DOCKER_ARCHIVE_OUTCOME: ${{ steps.fuzz_docker_archive.outcome }}
        run: |
          echo "Control request fuzz outcome: $CONTROL_OUTCOME"
          echo "Docker archive fuzz outcome: $DOCKER_ARCHIVE_OUTCOME"
          exit 1

  worker-image:
    name: Worker image
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Buildx
        run: bash ./scripts/install-verified-buildx.sh
      - name: Set up pinned BuildKit builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug=false
      - name: Build worker image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ci-runner-worker:test
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify worker image contract
        run: ./scripts/verify-worker-image.sh ci-runner-worker:test

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-status:
    name: ci-status
    if: always()
    needs:
      - markdown
      - shellcheck
      - shfmt
      - typos
      - editorconfig
      - gitleaks
      - lychee
      - comment-hygiene
      - actionlint
      - jsonschema
      - exec-bit
      - machine-specific-paths
      - eol-renormalize
      - zizmor
      - policy
      - go-quality
      - go-windows-build
      - go-fuzz
      - worker-image
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # No checkout here; the composites read the pull request through the API.
      # pr-contract upserts the advisory linkage comment and moves the linkage
      # label; ci-status records the `ci-lanes` commit status the carry-forward
      # branch reads back on the next contract-only event.
      pull-requests: write # Advisory linkage comment and label writes.
      statuses: write # Records and reads back the `ci-lanes` commit status.
    steps:
      - name: Check the pull-request contract
        uses: melodic-software/ci-workflows/.github/actions/pr-contract@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          token: ${{ github.token }}
          # Dependabot and the standards sync open pull requests that close no
          # issue, so without this they collect the advisory linkage comment
          # and the `needs-issue-linkage` label on every run. Exempts the
          # linkage check only; the Conventional Commits title check and the
          # do-not-merge label gate still apply to both authors. Exact login
          # equality, never a `*[bot]` pattern, so a new bot is not silently
          # skipped.
          exempt-authors: 'dependabot[bot],melodic-standards-sync[bot]'
      - name: Aggregate lane results
        # `!cancelled()` so a failing pr-contract step does not skip the
        # aggregation: the job still fails on the contract step's exit code, and
        # the `ci-lanes` status is on the SHA for the next contract-only run.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/ci-status@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          results: >-
            ${{ needs.markdown.result }}
            ${{ needs.shellcheck.result }}
            ${{ needs.shfmt.result }}
            ${{ needs.typos.result }}
            ${{ needs.editorconfig.result }}
            ${{ needs.gitleaks.result }}
            ${{ needs.lychee.result }}
            ${{ needs.comment-hygiene.result }}
            ${{ needs.actionlint.result }}
            ${{ needs.jsonschema.result }}
            ${{ needs.exec-bit.result }}
            ${{ needs.machine-specific-paths.result }}
            ${{ needs.eol-renormalize.result }}
            ${{ needs.zizmor.result }}
            ${{ needs.policy.result }}
            ${{ needs.go-quality.result }}
            ${{ needs.go-windows-build.result }}
            ${{ needs.go-fuzz.result }}
            ${{ needs.worker-image.result }}
            ${{ needs.dependency-review.result }}
          treat-skipped-as: pass
          token: ${{ github.token }}
