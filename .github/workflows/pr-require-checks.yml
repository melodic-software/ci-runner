name: pr-require-checks

on:
  push:
    branches: [main]
  pull_request:
    # `edited`, `labeled` and `unlabeled` can change the pr-title /
    # do-not-merge / issue-linkage answers without a new commit, so the required
    # check has to re-evaluate. Whether such an event is CONTRACT-ONLY (lanes
    # gated off, ci-status carrying the recorded `ci-lanes` verdict forward) is
    # decided by one predicate, repeated verbatim in `concurrency.group` and in
    # every job's `if:` except `ci-status` and `fuzz-go`:
    #
    #   github.event.pull_request.head.repo.full_name == github.repository &&
    #   (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    #    (github.event.action == 'edited' && !github.event.changes.base))
    #
    # An `edited` event carrying `changes.base` is a BASE-BRANCH change: the
    # merge commit the lanes test changes with it, so that runs in full. A fork
    # pull request is never contract-only — its token is read-only on
    # `pull_request` whatever `permissions:` requests, so it cannot record lane
    # state — and runs the full workflow on every event exactly as before.
    # `fuzz-go` is left ungated because its own condition already restricts it
    # to `schedule` and `workflow_dispatch`, and the predicate is true only on
    # `pull_request`, so the gate would be a no-op there.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The concurrency GROUP branches on the contract-only predicate (ci-perf Phase
# 6b); `cancel-in-progress` is a plain `true` because it takes one value per
# workflow and cannot branch.
#
# Contract-only branch: `ci-contract-<pr>-<run_id>`, unique per run. No
# contract-only run can be cancelled, evict anything, or be evicted. That is
# deliberate. The previous shape relied on a contract-only run queuing behind
# the full run whose `ci-lanes` status it reads, but eviction of a PENDING run
# is unconditional in GitHub's queuing ("any existing pending job or workflow
# in the same concurrency group will be canceled") and is NOT governed by
# `cancel-in-progress`, so a shared group let one event evict another and leave
# a check suite on the current head with no `ci-status` check run at all, a
# required check that stops reporting until someone re-runs that specific run
# (dotfiles#647, 2h14m silent). Uniqueness costs a burst of one-job runs when
# labels flip repeatedly, seconds each, writing nothing.
#
# Full branch: `<workflow>-<pr number || run_id>` with cancel-in-progress true,
# so a `synchronize` still cancels the run it supersedes. Keying pull requests
# on the number (not head_ref) keeps fork pull requests that share a branch
# name from cancelling each other's required runs. The fallback term is the
# per-repository push decision, and `github.run_id` is this repository's: every
# push, schedule and dispatch run gets its own group and therefore no push-side
# burst collapse, which is the behavior the previous key already had.
#
# The cost of the branch: a contract-only run no longer queues behind the full
# run whose `ci-lanes` status it carries forward, so the two race.
# `yield-to-full-run` on the job below fails it at once while a full run is in
# flight, whose newer ci-status then decides the gate, instead of it queuing or
# waiting.
#
# One hazard the branch does not remove, because no concurrency setting both
# removes it and keeps supersession: the full branch is keyed on the pull
# request number, which does not vary with the head SHA, so re-running a STALE
# run on a superseded head SHA lands in the CURRENT head's group and cancels
# the run that is actually reporting. Re-run the run on the current head
# instead. Contract-only runs are immune, being unique per `github.run_id`.
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    (github.event.action == 'edited' && !github.event.changes.base)))
    && format('ci-contract-{0}-{1}', github.event.pull_request.number, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: melodic-software/ci-workflows/.github/actions/markdownlint@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          config: .markdownlint-cli2.jsonc

  shellcheck:
    name: ShellCheck
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          rcfile: .shellcheckrc

  shfmt:
    name: Shell format
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell formatting
        uses: melodic-software/ci-workflows/.github/actions/shfmt@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0

  typos:
    name: Spelling
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: melodic-software/ci-workflows/.github/actions/typos@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          config: _typos.toml

  editorconfig-checker:
    name: EditorConfig
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check EditorConfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig-checker@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          config: .editorconfig-checker.json

  gitleaks:
    name: Secret scan
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          config: .gitleaks.toml

  lychee:
    name: Offline links
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local links and anchors
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          config: lychee.toml

  check-comment-markers:
    name: Comment hygiene
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan comment hygiene
        uses: melodic-software/ci-workflows/.github/actions/check-comment-markers@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0

  actionlint:
    name: Actionlint
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0

  jsonschema:
    name: JSON schemas
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Dependabot configuration
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          builtin-schema: vendor.github-workflows
          files: .github/workflows/*.yml

  check-exec-bit:
    name: Executable bits
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check executable bits
        uses: melodic-software/ci-workflows/.github/actions/check-exec-bit@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0

  check-machine-paths:
    name: Machine-specific paths
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check machine-specific paths
        uses: melodic-software/ci-workflows/.github/actions/check-machine-paths@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          # These files assert the official image's fixed in-container runner
          # home. They contain no host/user path; keep the exception exact.
          exclude: >-
            :(exclude)docs/worker-image.md
            :(exclude)scripts/Test-ReleasePins.ps1
            :(exclude)scripts/verify-worker-image.sh
            :(exclude)worker/capture-cgroup.sh
            :(exclude)worker/entrypoint.sh
            :(exclude)worker/set-state.sh

  check-line-endings:
    name: EOL normalization
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/check-line-endings@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0

  pr-audit-workflows:
    name: Zizmor
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read # Reusable advisory audit reads the checked-in workflow graph.
      # Reusable pr-audit-workflows.yml always declares security-events: write (expressions
      # are illegal in that scope). Callers must grant it too — reusable
      # workflows cannot elevate. Lane stays annotations-only
      # (upload-sarif defaults false); grant write so the job can start.
      security-events: write # Mandatory match for the reusable's own grant; see above.
    uses: melodic-software/ci-workflows/.github/workflows/pr-audit-workflows.yml@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
    with:
      paths: .

  test-policy-contracts:
    name: Product policy
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Test workflow scripts
        run: node --test .github/scripts/*.test.cjs
      - name: Verify immutable dependency and publication contracts
        shell: pwsh
        run: ./scripts/Test-ReleasePins.ps1

  pr-run-checks-go:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    uses: melodic-software/ci-workflows/.github/workflows/pr-run-checks-go.yml@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
    with:
      config: .golangci.yml

  build-go-windows:
    name: Go Windows builds
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile Windows executables
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -o /tmp/ci-runner.exe ./cmd/ci-runner
          go build -trimpath -ldflags='-H=windowsgui' -o /tmp/ci-runner-controller.exe ./cmd/ci-runner-controller

  fuzz-go:
    name: Go fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz control request decoding
        id: fuzz_control
        continue-on-error: true
        run: >-
          go test ./internal/control -run='^$'
          -fuzz='^FuzzReadRequest$' -fuzztime=30s
      - name: Fuzz Docker archive validation
        id: fuzz_docker_archive
        continue-on-error: true
        run: >-
          go test ./internal/runtime/docker -run='^$'
          -fuzz='^FuzzReadSingleRegularArchive$' -fuzztime=30s
      - name: Collect newly generated failing inputs
        if: >-
          steps.fuzz_control.outcome == 'failure' ||
          steps.fuzz_docker_archive.outcome == 'failure'
        env:
          FUZZ_FAILURES: ${{ runner.temp }}/go-fuzz-failures
        run: |
          mkdir -p "$FUZZ_FAILURES"
          git ls-files --others --exclude-standard -- \
            internal/control/testdata/fuzz/FuzzReadRequest \
            internal/runtime/docker/testdata/fuzz/FuzzReadSingleRegularArchive \
            | while IFS= read -r file; do
              cp --parents "$file" "$FUZZ_FAILURES"
            done
      - name: Upload minimized failing inputs
        if: >-
          steps.fuzz_control.outcome == 'failure' ||
          steps.fuzz_docker_archive.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-fuzz-failures-${{ github.run_id }}
          path: ${{ runner.temp }}/go-fuzz-failures
          if-no-files-found: ignore
      - name: Report fuzz failures
        if: >-
          always() &&
          (steps.fuzz_control.outcome == 'failure' ||
          steps.fuzz_docker_archive.outcome == 'failure')
        env:
          CONTROL_OUTCOME: ${{ steps.fuzz_control.outcome }}
          DOCKER_ARCHIVE_OUTCOME: ${{ steps.fuzz_docker_archive.outcome }}
        run: |
          echo "Control request fuzz outcome: $CONTROL_OUTCOME"
          echo "Docker archive fuzz outcome: $DOCKER_ARCHIVE_OUTCOME"
          exit 1

  build-worker-image:
    name: Worker image
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Buildx
        run: bash ./scripts/install-verified-buildx.sh
      - name: Set up pinned BuildKit builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          buildkitd-flags: --debug=false
      - name: Build worker image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ci-runner-worker:test
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify worker image contract
        run: ./scripts/verify-worker-image.sh ci-runner-worker:test

  review-dependencies:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-status:
    name: ci-status
    if: always()
    needs:
      - markdownlint
      - shellcheck
      - shfmt
      - typos
      - editorconfig-checker
      - gitleaks
      - lychee
      - check-comment-markers
      - actionlint
      - jsonschema
      - check-exec-bit
      - check-machine-paths
      - check-line-endings
      - pr-audit-workflows
      - test-policy-contracts
      - pr-run-checks-go
      - build-go-windows
      - fuzz-go
      - build-worker-image
      - review-dependencies
    runs-on: ubuntu-24.04
    # With `yield-to-full-run` a contract-only run lists in-flight runs once and
    # reads the status once, so it finishes in seconds. A full run's ci-status
    # runs after its lanes and waits at most `rerun-wait-seconds` (default 90)
    # for in-flight contract-only siblings before re-running them.
    timeout-minutes: 3
    permissions:
      contents: read # No checkout here; the composites read the pull request through the API.
      # `yield-to-full-run` lists this workflow's runs on the head SHA, and
      # `rerun-contract-only-siblings` re-runs the red contract-only ones once
      # the full run records `success`. Under an explicit permissions block every
      # unlisted scope defaults to none; write covers the read.
      actions: write # Lists this workflow's runs and re-runs contract-only siblings.
      # check-contract upserts the advisory linkage comment and moves the linkage
      # label; ci-status records the `ci-lanes` commit status the carry-forward
      # branch reads back on the next contract-only event.
      pull-requests: write # Advisory linkage comment and label writes.
      statuses: write # Records and reads back the `ci-lanes` commit status.
    steps:
      - name: Check the pull-request contract
        uses: melodic-software/ci-workflows/.github/actions/pr-require-checks/check-contract@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          token: ${{ github.token }}
          # Dependabot and the standards sync open pull requests that close no
          # issue, so without this they collect the advisory linkage comment
          # and the `needs-issue-linkage` label on every run. Exempts the
          # linkage check only; the Conventional Commits title check and the
          # do-not-merge label gate still apply to both authors. Exact login
          # equality, never a `*[bot]` pattern, so a new bot is not silently
          # skipped.
          exempt-authors: 'dependabot[bot],melodic-standards-sync[bot]'
      - name: Aggregate lane results
        # `!cancelled()` so a failing check-contract step does not skip the
        # aggregation: the job still fails on the contract step's exit code, and
        # the `ci-lanes` status is on the SHA for the next contract-only run.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/pr-require-checks/aggregate-results@6ba73b97b058602c4dd2bb6e2cce234d11011787 # v0.39.0
        with:
          results: >-
            ${{ needs.markdownlint.result }}
            ${{ needs.shellcheck.result }}
            ${{ needs.shfmt.result }}
            ${{ needs.typos.result }}
            ${{ needs.editorconfig-checker.result }}
            ${{ needs.gitleaks.result }}
            ${{ needs.lychee.result }}
            ${{ needs.check-comment-markers.result }}
            ${{ needs.actionlint.result }}
            ${{ needs.jsonschema.result }}
            ${{ needs.check-exec-bit.result }}
            ${{ needs.check-machine-paths.result }}
            ${{ needs.check-line-endings.result }}
            ${{ needs.pr-audit-workflows.result }}
            ${{ needs.test-policy-contracts.result }}
            ${{ needs.pr-run-checks-go.result }}
            ${{ needs.build-go-windows.result }}
            ${{ needs.fuzz-go.result }}
            ${{ needs.build-worker-image.result }}
            ${{ needs.review-dependencies.result }}
          treat-skipped-as: pass
          # A contract-only run never waits: while a full run on the SHA is in
          # flight it fails with "superseded by full run <url>", and that run's
          # newer ci-status decides the gate. Once the full run records
          # `success` it re-runs those red contract-only runs, which then read
          # the `success` and replace their red check runs.
          yield-to-full-run: 'true'
          rerun-contract-only-siblings: 'true'
          carry-forward-wait-seconds: '0'
          token: ${{ github.token }}
