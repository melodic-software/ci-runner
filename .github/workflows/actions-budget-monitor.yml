name: Actions Budget Monitor

on:
  schedule:
    # Daily, not the queue monitor's quarter-hourly cadence: included-minute
    # consumption is a month-scale signal, and this workflow's own minutes come
    # out of the pool it watches.
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-budget-monitor
  # false, not true: this serializes scheduled runs (never runs two at once)
  # instead of cancelling an in-flight one. The incident-issue upsert's
  # create-if-absent race freedom depends on it — two runs racing could both
  # find no open incident and both create one.
  cancel-in-progress: false

env:
  # The identity that opens/updates/closes this workflow's own incident
  # issues: the default GITHUB_TOKEN's REST-created content is authored by
  # this exact bot. The incident title and marker are public (embedded
  # verbatim in this workflow's source, in a public repo), so restricting
  # adoption to this author — not just marker/title text — is what stops a
  # non-maintainer from opening a decoy issue that gets adopted, silently
  # closed on the next healthy run, or used to fail the lookup closed and
  # suppress a real alert.
  ISSUE_AUTHOR_LOGIN: github-actions[bot]

jobs:
  monitor:
    name: Alert on Actions included-minute consumption
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # Upsert the marker-deduped incident issue in this repo.
    steps:
      - name: Checkout monitor implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure included-minute consumption
        id: measure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BILLING_ORG: ${{ github.repository_owner }}
          INCLUDED_MINUTES: '3000'
          # A missing secret must fail loudly rather than read as a healthy
          # zero-consumption month. github-script hides the token inside its
          # Octokit client, so presence is asserted here (a boolean, never the
          # value) and enforced by the script.
          BILLING_TOKEN_PRESENT: ${{ secrets.CI_RUNNER_BILLING_OBSERVER_TOKEN != '' }}
        with:
          github-token: ${{ secrets.CI_RUNNER_BILLING_OBSERVER_TOKEN }}
          script: |
            const monitor = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/budget-monitor.cjs`);
            await monitor.run({ github, core });

      # Alerts by upserting a marker-deduped incident issue instead of failing
      # this run (a successful execution is green even when it detects budget
      # pressure): schedule-triggered runs have no actor to notify, and a
      # by-design red here pollutes fleet-wide failure statistics. Runs on the
      # job's own GITHUB_TOKEN, scoped to this repository, because the
      # measurement step's billing token reads organization billing and is not
      # the identity that should write here.
      - name: Upsert budget incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUDGET_JSON: ${{ steps.measure.outputs.budget }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const monitor = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/budget-monitor.cjs`);
            await monitor.upsertIncident({ github, core });
