name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-title:
    permissions:
      pull-requests: read # Reusable semantic-title gate requires no write permission.
      # A reusable workflow may only use permissions the caller grants, so a
      # caller that grants less than the reusable's `permissions:` block is
      # rejected at startup. The gate requests `actions: read` for its
      # cancelled-vs-timed_out prerequisite resolver; this thin caller passes no
      # `prerequisite-result`, so the resolver never runs, but the grant is
      # still mandatory for the reusable to start at all.
      actions: read # Mandatory match for the reusable's own grant; see above.
    uses: melodic-software/ci-workflows/.github/workflows/semantic-pr.yml@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
