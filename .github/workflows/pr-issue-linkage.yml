name: pr-issue-linkage

# Requires the PR body to carry a native GitHub closing keyword (or the literal
# "No linked issue") and the four contract headers with content: "## Summary",
# "## Fix", "## Verification", and "## Related". Thin caller of the shared
# pr-issue-linkage reusable; the emitted required-check context is
# `pr-issue-linkage / pr-issue-linkage`. pull_request_target runs the
# base-branch definition (the gate reads PR body metadata only — no head code
# runs); `edited` re-validates on a body edit. Public repo: runs on the
# reusable's hosted default runner.
on:
  # zizmor: ignore[dangerous-triggers] metadata-only gate; rationale in the header comment
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-issue-linkage:
    permissions:
      pull-requests: read # the reusable now reads the live PR body itself
      actions: read # mandatory to start the reusable; see pr-title.yml for why
    uses: melodic-software/ci-workflows/.github/workflows/pr-issue-linkage.yml@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
    with:
      # Generated PR bodies cannot carry the closing-keyword + contract-header
      # markers; exact-login exemption per the reusable's contract, never a
      # `*[bot]` pattern, so an unknown future bot is not silently skipped.
      exempt-authors: dependabot[bot],melodic-standards-sync[bot]
